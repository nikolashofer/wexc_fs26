<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Artist App (Development Mode)</title>
</head>
<body>

<script type="module">

    // general imports

    import {SiteController} from "../../framework/client/js/controller/siteController.js";
    import {init} from "../../framework/client/js/init.js";

    // app starter specific imports

    import {ARTIST}            from "./js/appTypes.js";
    import {Meta}              from "./js/meta.js";
    import {memoryDB}          from './js/memoryDB.js';
    import {DevServiceFactory} from "../../framework/client/js/service/dev/devServiceFactory.js";

    import {defaultProjectors} from "../../framework/client/js/projector/default/projectors.js";
    import {nikProjectors} from "../../framework/client/js/projector/nik/projectors.js";

    const siteController = SiteController();
    const changeProjectors = init(
        siteController,
        DevServiceFactory(Meta(), memoryDB),
        {
            onInitialized: _meta => 
                siteController
                    .findEntity(ARTIST, "0")
                    .then(entity => siteController.setSelection({ entityName: ARTIST, entity }))
        }
    );

    document.getElementById("default").addEventListener("click", _e => {
        changeProjectors(defaultProjectors);
    });
    document.getElementById("nik").addEventListener("click", _e => {
        changeProjectors(nikProjectors);
    });

</script>

<div id="root"></div>

<div style="position: fixed; bottom: 0; right: 0;">
    <button id="default">Default</button>
    <button id="nik">Nik</button>
</div>
</body>
</html>
